stages:
  - test
  - build

backend_test:
  stage: test
  image: node:22-alpine
  services:
    - name: mongo:8
      alias: mongo
  variables:
    MONGO_URI: mongodb://mongo:27017/cloudtask_test
    JWT_SECRET: ci-test-secret
    PORT: 5000
    CLIENT_URL: http://localhost:5173
  before_script:
    - cd backend
    - npm ci
  script:
    - npm test

frontend_build:
  stage: build
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build

docker_build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t cloudtask-backend ./backend
    - docker build -t cloudtask-frontend ./frontend
